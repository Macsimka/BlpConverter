name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore BlpConverter.sln

      - name: Build
        run: dotnet build BlpConverter.sln -c Release --no-restore

      - name: Test
        run: dotnet test BlpConverter.Tests/BlpConverter.Tests.csproj -c Release --no-build
